[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-arcade"
version = "0.1.1"
description = "Bộ game arcade vận động ThingBot trên NEO (ThingEdu). Game #1: FlappyDe."
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
hardware = ["neo-hw"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
neo-arcade = "neo_arcade.hub:main"
flappyde = "neo_arcade.app:main"
dexe = "neo_arcade.dexe.app:main"
bongro = "neo_arcade.bongro.app:main"
damboc = "neo_arcade.damboc.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neo_arcade = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
